[package]
name = "codex-session-observatory-tauri"
version = "2.0.0"
edition = "2024"

[lib]
name = "codex_session_observatory_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codex-session-observatory"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
backend = { path = "../../backend" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Graphics_DirectWrite", "Win32_Globalization"] }

[dev-dependencies]
serde_json = "1"
