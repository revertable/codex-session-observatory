[package]
name = "codex-session-observatory-tauri"
version = "1.2.1"
edition = "2024"

[lib]
name = "codex_session_observatory_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codex-session-observatory"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
backend = { path = "../../backend" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
serde_json = "1"
